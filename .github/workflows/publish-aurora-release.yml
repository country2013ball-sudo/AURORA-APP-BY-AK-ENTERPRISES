name: Publish Aurora Engine Release APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK components
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "cmake;3.22.1" "ndk;25.1.8937393"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"

      - name: Build release APK
        working-directory: AuroraEngine
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Attach APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: AuroraEngine/app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true

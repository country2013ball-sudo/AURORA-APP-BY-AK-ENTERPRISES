name: Publish Aurora Engine Release APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK components
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "cmake;3.22.1" "ndk;25.1.8937393"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"

      - name: Run unit tests and Android lint
        working-directory: AuroraEngine
        run: |
          for attempt in 1 2 3; do
            if gradle testDebugUnitTest lintDebug --no-daemon --stacktrace; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Gradle check failed; retrying in $((attempt * 15)) seconds."
              sleep "$((attempt * 15))"
            fi
          done
          exit 1

      - name: Build release APK
        working-directory: AuroraEngine
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Prepare APK and SHA-256 checksum
        id: prepare
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          apk_name="AuroraEngine-${RELEASE_TAG}-debug-signed.apk"
          cp AuroraEngine/app/build/outputs/apk/release/app-release.apk "$apk_name"
          sha256sum "$apk_name" > "${apk_name}.sha256"
          echo "apk_name=$apk_name" >> "$GITHUB_OUTPUT"

      - name: Attach APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            **Signing notice:** This release-variant APK uses the repository's debug signing key and is intended for testing only. It is not signed for Play Store distribution.
          files: |
            ${{ steps.prepare.outputs.apk_name }}
            ${{ steps.prepare.outputs.apk_name }}.sha256
          fail_on_unmatched_files: true

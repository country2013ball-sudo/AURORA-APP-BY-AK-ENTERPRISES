name: Build and upload Aurora Engine APKs

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK components
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "cmake;3.22.1" "ndk;25.1.8937393"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"

      - name: Run unit tests and Android lint
        working-directory: AuroraEngine
        run: gradle testDebugUnitTest lintDebug --no-daemon --stacktrace

      - name: Build release and debug APKs
        working-directory: AuroraEngine
        run: gradle assembleRelease assembleDebug --no-daemon --stacktrace

      - name: Upload debug-signed release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aurora-engine-release-apk-debug-signed
          path: AuroraEngine/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aurora-engine-debug-apk
          path: AuroraEngine/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Explain release APK signing
        run: |
          {
            echo "### APK signing"
            echo
            echo "The release-variant APK is signed with the repository's debug key for testing only."
            echo "It is not a production or Play Store signing build."
          } >> "$GITHUB_STEP_SUMMARY"
